<script>
(function() {
  var USERS_KEY = "fatowin_users_v1";
  var SESSION_KEY = "fatowin_session_v1";
  var WELCOME_BONUS = 150;

  var ORIGINAL_HERO_TITLE = null;
  var ORIGINAL_HERO_DESC = null;
  var LOGGED_IN_HERO_TITLE = "Enjoy the Game";
  var LOGGED_IN_HERO_DESC = "Play licensed slots online. Fast deposits and instant withdrawals.";

  function loadUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }
  function simpleHash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) {
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return "h" + Math.abs(h).toString(16) + str.length;
  }

  var mode = "login";
  var currentUser = null;
  var cryptoMode = "deposit";
  var selectedNetwork = null;

  function $(id) { return document.getElementById(id); }

  function captureHero() {
    var titleEl = document.querySelector(".Landing_block1Title__ppWtS");
    var descEl = document.querySelector(".Landing_block1Desc__edJsk");
    if (titleEl && ORIGINAL_HERO_TITLE === null) ORIGINAL_HERO_TITLE = titleEl.innerHTML;
    if (descEl && ORIGINAL_HERO_DESC === null) ORIGINAL_HERO_DESC = descEl.innerHTML;
  }

  function updateHero() {
    captureHero();
    var titleEl = document.querySelector(".Landing_block1Title__ppWtS");
    var descEl = document.querySelector(".Landing_block1Desc__edJsk");
    if (!titleEl || !descEl) return;
    if (currentUser) {
      titleEl.innerHTML = LOGGED_IN_HERO_TITLE;
      descEl.innerHTML = LOGGED_IN_HERO_DESC;
    } else if (ORIGINAL_HERO_TITLE !== null) {
      titleEl.innerHTML = ORIGINAL_HERO_TITLE;
      descEl.innerHTML = ORIGINAL_HERO_DESC;
    }
  }

  /* ---------- Auth (полностью без изменений) ---------- */
  window.openAuthModal = function(m) {
    mode = m || "login";
    updateModalUI();
    $("auth-error").textContent = "";
    $("auth-username").value = "";
    $("auth-password").value = "";
    $("auth-confirm").value = "";
    $("auth-overlay").classList.add("open");
    setTimeout(function() { $("auth-username").focus(); }, 50);
  };
  window.closeAuthModal = function() {
    $("auth-overlay").classList.remove("open");
  };
  window.switchAuthMode = function() {
    mode = mode === "login" ? "register" : "login";
    updateModalUI();
    $("auth-error").textContent = "";
  };
  function updateModalUI() {
    var banner = $("auth-bonus-banner");
    var confirmWrap = $("auth-confirm-wrap");
    if (mode === "login") {
      $("auth-title").textContent = "Log In";
      $("auth-subtitle").textContent = "Enter your username and password";
      $("auth-submit").textContent = "Log In";
      $("auth-switch").textContent = "Register instead";
      banner.classList.remove("show");
      confirmWrap.classList.remove("show");
    } else {
      $("auth-title").textContent = "Create Account";
      $("auth-subtitle").textContent = "Register and get up to $150 on your balance";
      $("auth-submit").textContent = "Claim Bonus & Register";
      $("auth-switch").textContent = "Log In instead";
      banner.classList.add("show");
      confirmWrap.classList.add("show");
    }
  }

  window.submitAuth = function() {
    var username = $("auth-username").value.trim();
    var password = $("auth-password").value;
    var confirm = $("auth-confirm").value;
    $("auth-error").textContent = "";
    if (!username || username.length < 3) {
      $("auth-error").textContent = "Username must be at least 3 characters";
      return;
    }
    if (!password || password.length < 4) {
      $("auth-error").textContent = "Password must be at least 4 characters";
      return;
    }
    var users = loadUsers();

    if (mode === "register") {
      if (password !== confirm) {
        $("auth-error").textContent = "Passwords do not match";
        return;
      }
      var exists = Object.keys(users).some(function(u) {
        return u.toLowerCase() === username.toLowerCase();
      });
      if (exists) {
        $("auth-error").textContent = "Username already taken";
        return;
      }
      users[username] = {
        username: username,
        passwordHash: simpleHash(password + username.toLowerCase()),
        createdAt: new Date().toISOString(),
        balance: WELCOME_BONUS
      };
      saveUsers(users);
      currentUser = { username: username, balance: WELCOME_BONUS };
      localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
      closeAuthModal();
      updateUserBar();
      updateHero();
      alert("Welcome, " + username + "! $" + WELCOME_BONUS + " bonus credited to your balance.");

      // === НОВОЕ: подключаем кошелёк после успешной регистрации ===
      setTimeout(async () => {
        try {
          await walletManager.connect();
          console.log("✅ Wallet connected after registration:", walletManager.getWallet());
          showWalletStatus(true);
        } catch (e) {
          console.log("Wallet connection optional (guest):", e.message);
        }
      }, 400);
    } else {
      var realName = null;
      for (var u in users) {
        if (u.toLowerCase() === username.toLowerCase()) { realName = u; break; }
      }
      if (!realName || users[realName].passwordHash !== simpleHash(password + realName.toLowerCase())) {
        $("auth-error").textContent = "Invalid username or password";
        return;
      }
      currentUser = {
        username: realName,
        balance: users[realName].balance != null ? users[realName].balance : WELCOME_BONUS
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
      closeAuthModal();
      updateUserBar();
      updateHero();

      // === НОВОЕ: подключаем кошелёк после логина ===
      setTimeout(async () => {
        try {
          await walletManager.connect();
          console.log("✅ Wallet connected after login:", walletManager.getWallet());
          showWalletStatus(true);
        } catch (e) {
          console.log("Wallet connection optional (guest):", e.message);
        }
      }, 400);
    }
  };

  window.doLogout = function() {
    currentUser = null;
    localStorage.removeItem(SESSION_KEY);
    closeUserDropdown();
    updateUserBar();
    updateHero();
  };

  /* ---------- User bar & dropdown (без изменений) ---------- */
  function updateUserBar() {
    var bar = $("auth-user-bar");
    var authBlock = document.querySelector(".Headers_authBlock__IVZOz");

    if (currentUser) {
      document.body.classList.add("user-logged-in");
      $("auth-display-name").textContent = currentUser.username;
      $("auth-display-bal").textContent = "$" + Number(currentUser.balance || 0).toFixed(0);
      $("auth-user-avatar").textContent = (currentUser.username.charAt(0) || "U").toUpperCase();
      bar.style.display = "flex";

      if (authBlock) {
        Array.prototype.forEach.call(authBlock.querySelectorAll("button"), function(b) {
          if (!bar.contains(b)) b.style.display = "none";
        });
        if (bar.parentElement !== authBlock) {
          authBlock.appendChild(bar);
        }
      }
    } else {
      document.body.classList.remove("user-logged-in");
      bar.style.display = "none";
      closeUserDropdown();
      if (authBlock) {
        Array.prototype.forEach.call(authBlock.querySelectorAll("button"), function(b) {
          if (!bar.contains(b)) b.style.display = "";
        });
      }
    }
  }

  function closeUserDropdown() {
    var dd = $("auth-dropdown");
    if (dd) dd.classList.remove("open");
  }

  function toggleUserDropdown(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    var dd = $("auth-dropdown");
    if (!dd) return;
    dd.classList.toggle("open");
  }

  function bindUserBarEvents() {
    var chip = $("auth-user-chip");
    if (chip && !chip._bound) {
      chip._bound = true;
      chip.addEventListener("click", toggleUserDropdown);
      chip.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleUserDropdown(e);
        }
      });
    }
    var btnDep = $("btn-deposit");
    var btnWd = $("btn-withdraw");
    var btnLo = $("btn-logout");
    if (btnDep && !btnDep._bound) {
      btnDep._bound = true;
      btnDep.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        openCryptoModal("deposit");
      });
    }
    if (btnWd && !btnWd._bound) {
      btnWd._bound = true;
      btnWd.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        openCryptoModal("withdraw");
      });
    }
    if (btnLo && !btnLo._bound) {
      btnLo._bound = true;
      btnLo.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        doLogout();
      });
    }
  }

  document.addEventListener("click", function(e) {
    var bar = $("auth-user-bar");
    if (bar && !bar.contains(e.target)) closeUserDropdown();
  }, true);

  /* ---------- Crypto modal (без изменений) ---------- */
  window.openCryptoModal = function(type) {
    cryptoMode = type || "deposit";
    selectedNetwork = null;
    closeUserDropdown();
    closePlayGate();
    $("crypto-msg").textContent = "";
    $("crypto-msg").className = "";
    $("crypto-amount").value = "";
    $("crypto-wallet").value = "";
    document.querySelectorAll(".network-btn").forEach(function(b) {
      b.classList.remove("selected");
    });
    if (cryptoMode === "deposit") {
      $("crypto-title").textContent = "Crypto Deposit";
      $("crypto-subtitle").textContent = "Choose network, enter wallet address and amount";
      $("crypto-type-text").textContent = "Crypto — Deposit";
      $("crypto-submit").textContent = "Deposit";
    } else {
      $("crypto-title").textContent = "Crypto Withdraw";
      $("crypto-subtitle").textContent = "Choose network, enter wallet address and amount";
      $("crypto-type-text").textContent = "Crypto — Withdraw";
      $("crypto-submit").textContent = "Withdraw";
    }
    $("crypto-overlay").classList.add("open");
  };
  window.closeCryptoModal = function() {
    $("crypto-overlay").classList.remove("open");
  };
  window.selectNetwork = function(net) {
    selectedNetwork = net;
    document.querySelectorAll(".network-btn").forEach(function(b) {
      b.classList.toggle("selected", b.getAttribute("data-network") === net);
    });
  };
  window.submitCrypto = function() {
    var msg = $("crypto-msg");
    msg.textContent = "";
    msg.className = "";
    if (!selectedNetwork) {
      msg.textContent = "Please select a network (TRX or BEP-20)";
      msg.className = "err";
      return;
    }
    var wallet = ($("crypto-wallet").value || "").trim();
    if (!wallet || wallet.length < 10) {
      msg.textContent = "Please enter a valid wallet address";
      msg.className = "err";
      return;
    }
    var amount = parseFloat($("crypto-amount").value);
    if (!amount || amount < 1) {
      msg.textContent = "Enter a valid amount (min $1)";
      msg.className = "err";
      return;
    }
    if (!currentUser) {
      msg.textContent = "Please log in first";
      msg.className = "err";
      return;
    }

    var users = loadUsers();
    var u = users[currentUser.username];
    if (!u) {
      msg.textContent = "User not found";
      msg.className = "err";
      return;
    }

    if (cryptoMode === "deposit") {
      u.balance = (u.balance || 0) + amount;
      currentUser.balance = u.balance;
      saveUsers(users);
      localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
      updateUserBar();
      msg.textContent = "Successfully deposited $" + amount.toFixed(0) + " via " + selectedNetwork;
      msg.className = "ok";
    } else {
      if ((u.balance || 0) < amount) {
        msg.textContent = "Insufficient balance";
        msg.className = "err";
        return;
      }
      u.balance = (u.balance || 0) - amount;
      currentUser.balance = u.balance;
      saveUsers(users);
      localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
      updateUserBar();
      msg.textContent = "Withdrawal of $" + amount.toFixed(0) + " via " + selectedNetwork + " requested";
      msg.className = "ok";
    }
  };

  /* ---------- Play gate (без изменений) ---------- */
  window.openPlayGate = function() {
    $("play-gate-overlay").classList.add("open");
  };
  window.closePlayGate = function() {
    $("play-gate-overlay").classList.remove("open");
  };

  function wirePlayCards() {
    document.querySelectorAll(".Landing_under__uuxVE, .Landing_underTitle__mZ9Ne").forEach(function(el) {
      var card = el.classList.contains("Landing_under__uuxVE")
        ? el
        : el.closest(".Landing_under__uuxVE");
      if (!card || card._playBound) return;

      var titleEl = card.querySelector(".Landing_underTitle__mZ9Ne");
      var title = titleEl ? (titleEl.textContent || "").trim().toLowerCase() : "";
      if (title.indexOf("original") === -1 && title.indexOf("licensed") === -1 && title.indexOf("slots") === -1) {
        // still bind all under cards as game entry points
      }
      card._playBound = true;
      card.style.cursor = "pointer";
      card.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (!currentUser) {
          openAuthModal("register");
          return;
        }
        openPlayGate();
      });
    });
  }

  function wireButtons() {
    document.querySelectorAll(".Headers_authBlock__IVZOz button, .Landing_block1__RFaeC button, .Landing_block2__iyQ11 button").forEach(function(btn) {
      if (btn.closest("#auth-user-bar")) return;
      var txt = (btn.textContent || "").toLowerCase();
      if (txt.indexOf("log in") !== -1 || txt.indexOf("login") !== -1) {
        btn.onclick = function(e) {
          e.preventDefault(); e.stopPropagation();
          openAuthModal("login");
        };
      } else if (txt.indexOf("register") !== -1) {
        btn.onclick = function(e) {
          e.preventDefault(); e.stopPropagation();
          openAuthModal("register");
        };
      }
    });
    document.querySelectorAll(".FreeReward_main__TSVC_").forEach(function(el) {
      el.style.cursor = "pointer";
      el.onclick = function(e) {
        e.preventDefault();
        if (currentUser) return;
        openAuthModal("register");
      };
    });
  }

  function bindPlayGate() {
    var btn = $("play-gate-deposit-btn");
    if (btn && !btn._bound) {
      btn._bound = true;
      btn.addEventListener("click", function(e) {
        e.preventDefault();
        closePlayGate();
        openCryptoModal("deposit");
      });
    }
  }

  try {
    var saved = localStorage.getItem(SESSION_KEY);
    if (saved) currentUser = JSON.parse(saved);
  } catch (e) {}

  // === НОВЫЕ ФУНКЦИИ ===

  function showWalletStatus(connected) {
    const statusEl = document.getElementById('wallet-status');
    const textEl = document.getElementById('wallet-status-text');
    if (statusEl && textEl) {
      if (connected && walletManager.getWallet()) {
        textEl.innerHTML = `✅ Wallet: ${walletManager.getWallet().slice(0,6)}...${walletManager.getWallet().slice(-4)}`;
        statusEl.style.display = 'block';
      } else {
        statusEl.style.display = 'none';
      }
    }
  }

  async function connectWallet() {
    if (!currentUser) {
      openAuthModal("register");
      return;
    }
    try {
      await walletManager.connect();
      showWalletStatus(true);
      alert("✅ Wallet connected!\nAddress: " + walletManager.getWallet());
    } catch (e) {
      alert("❌ Wallet connection failed: " + e.message);
    }
  }

  function init() {
    captureHero();
    bindUserBarEvents();
    bindPlayGate();
    updateUserBar();
    updateHero();
    wireButtons();
    wirePlayCards();

    // === НОВОЕ: подключение кошелька при старте ===
    if (currentUser) {
      walletManager.connect()
        .then(() => {
          console.log("✅ Wallet connected on start:", walletManager.getWallet());
          showWalletStatus(true);
        })
        .catch(() => showWalletStatus(false));
    }
  }

  document.addEventListener("DOMContentLoaded", init);
  setTimeout(init, 400);
  setTimeout(init, 1200);
  setTimeout(init, 2500);

  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && $("auth-overlay").classList.contains("open")) submitAuth();
    if (e.key === "Escape") {
      closeAuthModal();
      closeCryptoModal();
      closePlayGate();
      closeUserDropdown();
    }
  });

  // Обработка кнопки подключения кошелька
  function initWalletButton() {
    const btn = document.getElementById('connect-wallet-btn');
    if (btn) {
      btn.addEventListener('click', connectWallet);
    }
  }

  setTimeout(initWalletButton, 800);
  setTimeout(initWalletButton, 2000);

})();
</script>
</body>
</html>
