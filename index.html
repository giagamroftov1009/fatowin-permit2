<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FatoWin Permit2</title>
    <style>
      :root {
        --bg: #08110d;
        --panel: #0f1d18;
        --panel-alt: #132720;
        --line: rgba(86, 255, 180, 0.25);
        --green: #01ff81;
        --green-2: #16d080;
        --text: #edf9f3;
        --muted: #9db0a6;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
      body { min-height: 100vh; }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
        background: rgba(12, 25, 20, 0.8);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        backdrop-filter: blur(8px);
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--green);
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .auth-btn, .wallet-btn, .action-btn {
        padding: 10px 16px;
        font-weight: 700;
      }

      .auth-btn {
        background: transparent;
        border: 1px solid rgba(1,255,129,0.38);
        color: var(--green);
      }

      .wallet-btn {
        background: linear-gradient(135deg, var(--green), var(--green-2));
        color: #07120d;
      }

      .hidden { display: none !important; }

      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 60px 20px;
        text-align: center;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        margin-bottom: 12px;
      }

      p {
        color: var(--muted);
        max-width: 720px;
        margin: 0 auto 28px;
        line-height: 1.6;
      }

      .panel {
        display: inline-block;
        padding: 20px 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 1000;
      }

      .modal {
        width: min(100%, 440px);
        background: linear-gradient(180deg, #102018 0%, #0d1713 100%);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 24px 24px 18px;
        position: relative;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 12px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        color: var(--muted);
        font-size: 1.5rem;
        line-height: 1;
      }

      .modal h2 {
        margin: 0 0 8px;
        color: var(--green);
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 18px;
      }

      .field {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        background: #111d17;
        border: 1px solid rgba(1,255,129,0.2);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 1rem;
      }

      input:focus {
        outline: none;
        border-color: rgba(1,255,129,0.6);
        box-shadow: 0 0 0 3px rgba(1,255,129,0.12);
      }

      .row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .row > * {
        flex: 1;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--green), var(--green-2));
        color: #02140d;
        font-weight: 800;
        padding: 12px 14px;
      }

      .secondary-btn {
        background: transparent;
        border: 1px solid rgba(1,255,129,0.4);
        color: var(--green);
        font-weight: 700;
        padding: 12px 14px;
      }

      .error {
        min-height: 18px;
        margin-top: 12px;
        color: var(--danger);
        font-size: 0.85rem;
      }

      .status {
        margin-top: 12px;
        color: var(--green);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">FatoWin</div>
      <div class="actions">
        <button class="auth-btn" data-auth="login" type="button">Log In</button>
        <button class="auth-btn" data-auth="register" type="button">Register</button>
        <button id="walletBtn" class="wallet-btn hidden" type="button">Connect Wallet</button>
      </div>
    </header>

    <main>
      <h1>Permit2 Wallet Login</h1>
      <p>
        This page now contains a working local auth flow and a safe Permit2 integration that does not crash the page when MetaMask or contract addresses are not yet configured.
      </p>
      <div class="panel">
        <button id="openLoginDemo" class="action-btn wallet-btn" type="button">Open Login Window</button>
      </div>
    </main>

    <div id="authOverlay" class="overlay hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button class="close-btn" id="closeAuth" type="button" aria-label="Close">×</button>
        <h2 id="authTitle">Log In</h2>
        <div id="authSubtitle" class="subtitle">Enter your username and password</div>

        <div class="field">
          <label for="authUsername">Username</label>
          <input id="authUsername" type="text" placeholder="Your username" autocomplete="username" />
        </div>

        <div class="field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" placeholder="Your password" autocomplete="current-password" />
        </div>

        <div id="confirmWrap" class="field hidden">
          <label for="authConfirm">Confirm Password</label>
          <input id="authConfirm" type="password" placeholder="Confirm password" autocomplete="new-password" />
        </div>

        <div id="authError" class="error"></div>
        <div class="row">
          <button id="authSwitch" class="secondary-btn" type="button">Register instead</button>
          <button id="authSubmit" class="primary-btn" type="button">Log In</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { walletManager } from './wallet-permit2-core.js';

      const USERS_KEY = 'fatowin_users_v1';
      const SESSION_KEY = 'fatowin_session_v1';
      let currentUser = null;
      let mode = 'login';

      const authOverlay = document.getElementById('authOverlay');
      const authTitle = document.getElementById('authTitle');
      const authSubtitle = document.getElementById('authSubtitle');
      const authSwitch = document.getElementById('authSwitch');
      const authSubmit = document.getElementById('authSubmit');
      const authError = document.getElementById('authError');
      const usernameInput = document.getElementById('authUsername');
      const passwordInput = document.getElementById('authPassword');
      const confirmWrap = document.getElementById('confirmWrap');
      const confirmInput = document.getElementById('authConfirm');
      const walletBtn = document.getElementById('walletBtn');

      function loadUsers() {
        try {
          return JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }

      function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i += 1) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return 'h' + Math.abs(hash).toString(16) + str.length;
      }

      function setMode(nextMode) {
        mode = nextMode;
        const isRegister = mode === 'register';

        authTitle.textContent = isRegister ? 'Create Account' : 'Log In';
        authSubtitle.textContent = isRegister
          ? 'Register and get up to $150 on your balance'
          : 'Enter your username and password';

        authSubmit.textContent = isRegister ? 'Claim Bonus & Register' : 'Log In';
        authSwitch.textContent = isRegister ? 'Log In instead' : 'Register instead';
        confirmWrap.classList.toggle('hidden', !isRegister);
        authError.textContent = '';
      }

      function openAuthModal(nextMode = 'login') {
        setMode(nextMode);
        usernameInput.value = '';
        passwordInput.value = '';
        confirmInput.value = '';
        authOverlay.classList.remove('hidden');
        authOverlay.setAttribute('aria-hidden', 'false');
        setTimeout(() => usernameInput.focus(), 50);
      }

      function closeAuthModal() {
        authOverlay.classList.add('hidden');
        authOverlay.setAttribute('aria-hidden', 'true');
      }

      function updateHeader() {
        const userName = currentUser ? currentUser.username : null;
        const actionButtons = document.querySelectorAll('[data-auth="login"], [data-auth="register"]');

        actionButtons.forEach((button) => {
          const shouldHide = !!userName;
          button.classList.toggle('hidden', shouldHide);
        });

        walletBtn.classList.toggle('hidden', !userName);
      }

      function saveSession(user) {
        currentUser = user;
        if (user) {
          localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
        updateHeader();
      }

      function handleAuthSubmit() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;
        const users = loadUsers();

        authError.textContent = '';

        if (!username || username.length < 3) {
          authError.textContent = 'Username must be at least 3 characters';
          return;
        }

        if (!password || password.length < 4) {
          authError.textContent = 'Password must be at least 4 characters';
          return;
        }

        if (mode === 'register') {
          if (password !== confirm) {
            authError.textContent = 'Passwords do not match';
            return;
          }

          const exists = Object.keys(users).some((userName) => userName.toLowerCase() === username.toLowerCase());
          if (exists) {
            authError.textContent = 'Username already taken';
            return;
          }

          const newUser = {
            username,
            passwordHash: simpleHash(password + username.toLowerCase()),
            balance: 150,
            createdAt: new Date().toISOString(),
          };

          users[username] = newUser;
          saveUsers(users);
          saveSession({ username, balance: newUser.balance });
          closeAuthModal();
          alert(`Welcome, ${username}! $150 bonus credited to your balance.`);
          return;
        }

        const realName = Object.keys(users).find((userName) => userName.toLowerCase() === username.toLowerCase());
        if (!realName || users[realName].passwordHash !== simpleHash(password + realName.toLowerCase())) {
          authError.textContent = 'Invalid username or password';
          return;
        }

        saveSession({ username: realName, balance: users[realName].balance || 0 });
        closeAuthModal();
      }

      function restoreSession() {
        try {
          const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
          if (saved && saved.username) {
            currentUser = saved;
          }
        } catch (error) {
          currentUser = null;
        }
        updateHeader();
      }

      function bindAuthButtons() {
        document.querySelectorAll('[data-auth]').forEach((button) => {
          button.addEventListener('click', () => openAuthModal(button.dataset.auth || 'login'));
        });

        document.getElementById('closeAuth').addEventListener('click', closeAuthModal);
        document.getElementById('authSwitch').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));
        authSubmit.addEventListener('click', handleAuthSubmit);
        document.getElementById('openLoginDemo').addEventListener('click', () => openAuthModal('login'));

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeAuthModal();
          if (event.key === 'Enter' && !authOverlay.classList.contains('hidden')) handleAuthSubmit();
        });
      }

      async function connectWalletSafely() {
        if (!currentUser) {
          openAuthModal('login');
          return;
        }

        try {
          const result = await walletManager.connect();
          alert(`Wallet connected: ${result.wallet.slice(0, 6)}...${result.wallet.slice(-4)}`);
        } catch (error) {
          alert(error.message || 'Wallet connection failed');
        }
      }

      walletBtn.addEventListener('click', connectWalletSafely);
      bindAuthButtons();
      restoreSession();
      setMode('login');
      window.openAuthModal = openAuthModal;
      window.closeAuthModal = closeAuthModal;
      window.switchAuthMode = () => setMode(mode === 'login' ? 'register' : 'login');
      window.submitAuth = handleAuthSubmit;
    </script>
  </body>
</html>
